<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${topic.name} + ' - Lý Thuyết'">Lý Thuyết</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu">☰</button>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/" class="back-link">← Trang chủ</a>
            <h2>📚 Ôn Tập</h2>
        </div>
        <ul class="nav-list">
            <li th:each="t : ${topics}">
                <a th:href="@{'/topic/' + ${t.id}}" class="nav-link" th:classappend="${t.id == topic.id} ? 'active'">
                    <span class="nav-icon" th:text="${t.icon}"></span>
                    <span th:text="${t.name}"></span>
                </a>
            </li>
        </ul>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="content">
        <div class="page-header theory-page-header">
            <div class="page-header-left">
                <h1>
                    <span th:text="${topic.icon}"></span>
                    <span th:text="${topic.name} + ' - Lý Thuyết'"></span>
                </h1>
                <p th:text="${topic.description}"></p>
            </div>
            <div class="page-header-actions">
                <a th:href="@{'/topic/' + ${topic.id}}" class="btn btn-primary">📝 Đến Bài Tập</a>
            </div>
        </div>

        <div class="reading-progress-bar">
            <div class="reading-progress-fill" id="readingProgress"></div>
        </div>

        <div class="theory-layout">
            <aside class="toc-sidebar" id="tocSidebar">
                <div class="toc-header">
                    <h3>📑 Mục Lục</h3>
                    <button class="toc-toggle" id="tocToggle" title="Thu gọn">◀</button>
                </div>
                <nav class="toc-nav" id="tocNav"></nav>
            </aside>

            <div class="theory-main">
                <div class="theory-content markdown-body" id="theoryContent" th:utext="${topic.theoryHtml}"></div>

                <div class="theory-nav-buttons">
                    <a th:href="@{'/topic/' + ${topic.id}}" class="btn btn-primary btn-lg">
                        📝 Bắt Đầu Làm Bài Tập →
                    </a>
                </div>
            </div>
        </div>
    </main>

    <button class="scroll-to-top" id="scrollToTop" title="Lên đầu trang">↑</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        initTheoryPage();
    </script>
</body>
</html>
