<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Bài ' + ${exercise.id} + ' - ' + ${exercise.title}">Bài Tập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
</head>
<body>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu">☰</button>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a th:href="@{'/topic/' + ${topic.id}}" class="back-link">← Danh sách bài tập</a>
            <a th:href="@{/interview}" class="back-link">💼 C++ Interview</a>
            <h2>📚 Ôn Tập</h2>
        </div>
        <ul class="nav-list">
            <li th:each="ex : ${topic.exercises}">
                <a th:href="@{'/topic/' + ${topic.id} + '/exercise/' + ${ex.id}}"
                   class="nav-link exercise-nav-link"
                   th:classappend="${ex.id == exercise.id} ? 'active'"
                   th:attr="data-exercise-id=${ex.id}">
                    <span class="nav-icon exercise-status-icon" th:id="'nav-status-' + ${ex.id}">📝</span>
                    <span th:text="'Bài ' + ${ex.id} + ': ' + ${ex.title}"></span>
                </a>
            </li>
        </ul>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="content content-wide">
        <div class="exercise-page">
            <!-- Exercise Header -->
            <div class="exercise-top-bar">
                <div class="exercise-top-info">
                    <h1 th:text="'Bài ' + ${exercise.id} + ': ' + ${exercise.title}"></h1>
                    <span class="difficulty-badge"
                          th:classappend="${exercise.difficulty.contains('Khó')} ? 'hard' : (${exercise.difficulty.contains('Trung')} ? 'medium' : 'easy')"
                          th:text="${exercise.difficulty}"></span>
                </div>
                <div class="exercise-top-nav">
                    <a th:if="${exercise.id > 1}"
                       th:href="@{'/topic/' + ${topic.id} + '/exercise/' + ${exercise.id - 1}}"
                       class="btn btn-secondary btn-sm">← Bài trước</a>
                    <a th:if="${exercise.id < #lists.size(topic.exercises)}"
                       th:href="@{'/topic/' + ${topic.id} + '/exercise/' + ${exercise.id + 1}}"
                       class="btn btn-secondary btn-sm">Bài tiếp →</a>
                    <a th:href="@{'/topic/' + ${topic.id} + '/theory'}"
                       class="btn btn-outline btn-sm">📖 Xem Lý Thuyết</a>
                </div>
            </div>

            <!-- Split Pane: Description | Editor -->
            <div class="exercise-split">
                <!-- Left: Problem Description -->
                <div class="exercise-description" id="exerciseDesc">
                    <div class="panel-tabs">
                        <button class="panel-tab active" data-panel="desc-tab">📋 Đề Bài</button>
                        <button class="panel-tab" data-panel="solution-tab"
                                id="solutionTabBtn" onclick="showSolutionTab()">💡 Lời Giải</button>
                    </div>
                    <div class="panel-content" id="desc-tab">
                        <div class="description-content markdown-body" th:utext="${exercise.descriptionHtml}"></div>
                    </div>
                    <div class="panel-content" id="solution-tab" style="display:none;">
                        <div class="solution-tabs" th:if="${exercise.solutions != null and #lists.size(exercise.solutions) > 0}">
                            <div class="solution-tab-bar">
                                <button th:each="sol, iter : ${exercise.solutions}"
                                        class="solution-tab-btn"
                                        th:classappend="${iter.index == 0} ? 'active'"
                                        th:attr="data-sol-idx=${iter.index}"
                                        th:text="'Cách ' + ${iter.count} + ': ' + ${sol.approach}"
                                        onclick="switchSolution(this)"></button>
                            </div>
                            <div th:each="sol, iter : ${exercise.solutions}"
                                 class="solution-content markdown-body"
                                 th:id="'sol-' + ${iter.index}"
                                 th:styleappend="${iter.index != 0} ? 'display:none;'"
                                 th:utext="${sol.codeHtml}"></div>
                        </div>
                        <div th:if="${exercise.solutions == null or #lists.size(exercise.solutions) == 0}">
                            <p class="text-muted">Đáp án đang được cập nhật...</p>
                        </div>
                    </div>
                </div>

                <!-- Right: Code Editor + Result -->
                <div class="exercise-editor-panel">
                    <div class="code-section">
                        <div class="code-section-header">
                            <h3>💻 Code Editor</h3>
                            <div class="code-lang-badge" id="codeLangBadge" th:text="${topic.id == 'sql'} ? 'SQL' : 'Java'">Java</div>
                        </div>
                        <div class="editor-container">
                            <textarea id="codeEditor" th:text="${topic.id == 'sql'} ? '-- Viết câu lệnh SQL của bạn ở đây
-- Dữ liệu mẫu đã được tạo sẵn với các bảng:
-- phong_ban, nhan_vien, du_an, phan_cong

SELECT * FROM nhan_vien LIMIT 5;
' : (${exercise.boilerplateCode != null} ? ${exercise.boilerplateCode} : 'public class Solution {
    public static void main(String[] args) {
        // Viết code của bạn ở đây

    }
}')"></textarea>
                        </div>
                        <div class="action-buttons">
                            <button id="runBtn" class="btn btn-success" onclick="runCode()">
                                ▶ Chạy (Run)
                            </button>
                            <button id="checkBtn" class="btn btn-primary" onclick="checkCode()">
                                ✅ Nộp Bài (Submit)
                            </button>
                            <button class="btn btn-secondary" onclick="resetCode()">
                                🔄 Làm Lại
                            </button>
                        </div>
                    </div>

                    <!-- Result Panel -->
                    <div id="resultPanel" class="result-panel" style="display:none;">
                        <div class="result-panel-header">
                            <div id="resultHeader" class="result-header"></div>
                            <button class="result-close" onclick="closeResult()">&times;</button>
                        </div>
                        <div id="resultScore" class="result-score"></div>
                        <div id="testResultsPanel" class="test-results-panel" style="display:none;"></div>
                        <div id="resultFeedback" class="result-feedback"></div>
                        <div class="result-output-wrapper">
                            <div class="result-output-label">Output:</div>
                            <pre id="resultOutput" class="result-output"></pre>
                        </div>
                        <pre id="resultError" class="result-error"></pre>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:inline="javascript">
        var topicId = '[[${topic.id}]]';
        var exerciseId = [[${exercise.id}]];
        var totalExercises = [[${#lists.size(topic.exercises)}]];
        var editorLang = '[[${topic.id}]]' === 'sql' ? 'sql' : 'java';
        var boilerplateCode = /*[[${exercise.boilerplateCode}]]*/ null;
        initEditor(editorLang);
        initExerciseNav();
    </script>
</body>
</html>
