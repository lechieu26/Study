<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Interview Notes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body>
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu">☰</button>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/" class="back-link">← Trang chủ</a>
            <h2>📚 Ôn Tập</h2>
        </div>
        <ul class="nav-list">
            <li>
                <a th:href="@{/interview}" class="nav-link active">
                    <span class="nav-icon">💼</span>
                    <span>C++ Interview</span>
                </a>
            </li>
            <li th:each="group : ${topicGroups}" class="nav-group">
                <div class="nav-group-header">
                    <span class="nav-group-icon" th:text="${group.icon}"></span>
                    <span class="nav-group-title" th:text="${group.name}"></span>
                </div>
                <ul class="nav-group-items">
                    <li th:each="t : ${group.topics}">
                        <a th:href="@{'/topic/' + ${t.id}}" class="nav-link">
                            <span class="nav-icon" th:text="${t.icon}"></span>
                            <span th:text="${t.name}"></span>
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <main class="content">
        <div class="page-header theory-page-header">
            <div class="page-header-left">
                <h1>
                    <span>💼</span>
                    <span>C++ Interview Notes</span>
                </h1>
                <p>Kho kiến thức phỏng vấn đọc trực tiếp từ thư mục DocsCpp.</p>
            </div>
        </div>

        <div class="reading-progress-bar">
            <div class="reading-progress-fill" id="readingProgress"></div>
        </div>

        <div th:if="${#lists.isEmpty(notes)}" class="quiz-empty">
            <div class="quiz-empty-icon">📄</div>
            <h3>Chưa tìm thấy ghi chú</h3>
            <p>Hãy kiểm tra thư mục DocsCpp hoặc cấu hình JVM property docscpp.dir.</p>
        </div>

        <div th:if="${!#lists.isEmpty(notes)}" class="interview-layout">
            <aside class="interview-note-list">
                <h2>Danh sách kiến thức</h2>
                <a th:each="note : ${notes}"
                   th:href="@{'/interview/' + ${note.id}}"
                   class="interview-note-card"
                   th:classappend="${selectedNote != null and note.id == selectedNote.id} ? 'active'">
                    <strong th:text="${note.title}"></strong>
                </a>
            </aside>

            <div class="interview-reader">
                <aside class="toc-sidebar" id="tocSidebar">
                    <div class="toc-header">
                        <h3>📑 Mục Lục</h3>
                        <button class="toc-toggle" id="tocToggle" title="Thu gọn">◀</button>
                    </div>
                    <nav class="toc-nav" id="tocNav"></nav>
                </aside>

                <div class="theory-main">
                    <div class="interview-selected-meta" th:if="${selectedNote != null}">
                        <span th:text="${selectedNote.fileName}"></span>
                    </div>
                    <div class="theory-content markdown-body" id="theoryContent" th:utext="${selectedNote.html}"></div>
                </div>
            </div>
        </div>
    </main>

    <button class="scroll-to-top" id="scrollToTop" title="Lên đầu trang">↑</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
    <script>
        initTheoryPage();
    </script>
</body>
</html>
