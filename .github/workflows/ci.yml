name: CI

on:
  push:
    branches: [main, devin/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: study-app
        run: mvn clean package -DskipTests -B

      - name: Run tests
        working-directory: study-app
        run: mvn test -B

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: study-roadmap-jar
          path: study-app/target/study-roadmap-*.jar
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t study-roadmap:${{ github.sha }} .

      - name: Verify container starts
        run: |
          docker run -d --name test-app -p 8080:8080 study-roadmap:${{ github.sha }}
          sleep 15
          curl --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8080 || (docker logs test-app && exit 1)
          docker stop test-app
